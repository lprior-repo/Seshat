$schema: "https://moonrepo.dev/schemas/tasks.json"
tasks:
  serve:
    script: |
      dx serve --platform web --port 8081
    options:
      cache: false

  check:
    script: |
      /usr/bin/cargo check

  test:
    script: |
      /usr/bin/cargo test

  clippy:
    script: |
      /usr/bin/cargo clippy -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

  fmt:
    script: |
      /usr/bin/cargo fmt --check

  build-web:
    script: |
      dx build --platform web

  e2e-smoke:
    command: "npm exec playwright test -- --project baseline-chromium --grep @p0-smoke"
    options:
      cache: false

  e2e-redqueen-wave1:
    command: "npm exec playwright test -- --project rq-wave1"
    options:
      cache: false

  e2e-redqueen-replay:
    command: "npm exec playwright test -- --project rq-wave1 --grep RQ-A01"
    options:
      cache: false

  e2e-redqueen-wave3:
    command: "npm exec playwright test -- --project rq-wave3"
    options:
      cache: false

  coverage:
    script: |
      /usr/bin/cargo llvm-cov --summary-only

  coverage-core:
    script: |
      /usr/bin/cargo llvm-cov --summary-only --ignore-filename-regex '(src/main.rs|src/bin/|src/ui/|src/hooks/)'

  ci:
    script: |
      moon run :check
      moon run :test
      moon run :clippy
      moon run :e2e-smoke
      moon run :e2e-redqueen-replay
    options:
      cache: true

  ci-hardening:
    script: |
      moon run :ci
      moon run :e2e-redqueen-wave1
      moon run :e2e-redqueen-wave3
    options:
      cache: true
