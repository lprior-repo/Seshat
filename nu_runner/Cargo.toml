[package]
name = "nu_runner"
version = "0.1.0"
edition = "2021"

[dependencies]
# Error handling
thiserror = "2.0"

# Async runtime
tokio = { version = "1", features = ["process", "time", "rt-multi-thread"] }

# Utilities
itertools = "0.14"
tap = "1.0"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1", features = ["test-util", "macros"] }
