[workspace]

[package]
name = "io_005_test"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "io_005_test"
path = "main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "rt"] }
tempfile = "3.10"
