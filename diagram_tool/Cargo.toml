[package]
name = "diagram_tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "diagram_tool"
path = "src/main.rs"

[lib]
name = "diagram_tool"
path = "src/lib.rs"

[features]
default = ["desktop", "server"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
server = ["dioxus/server"]
fullstack = ["web", "server"]
async-db = ["dep:sqlx", "dep:tokio"]

[dependencies]
dioxus          = { version = "0.7" }

# Serialization + Patching
serde           = { version = "1.0", features = ["derive"] }
serde_json      = "1.0"

# IDs
uuid            = { version = "1.0", features = ["v4", "serde"] }

# Asset embedding
include_dir     = { version = "0.7", features = ["glob"] }

# Export
tiny-skia       = "0.12"
image           = "0.25"
base64          = "0.22"
resvg           = "0.47"

# CLI
clap            = { version = "4.0", features = ["derive"] }

# Utilities
anyhow          = "1.0"
thiserror = "2.0.18"
itertools = "0.14.0"
tap = "1.0.1"
rpds = "1.2.0"
im = { version = "15.1.0", features = ["serde"] }
petgraph = "0.8"
tempfile = "3.10"
num_cpus = "1.16"

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], optional = true }
tokio = { version = "1.1", features = ["rt", "sync"], optional = true }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.10.0"
tempfile = "3.10"
criterion = "0.5"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "rt"] }

[[bench]]
name = "db_performance"
harness = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { version = "1.0", features = ["v4", "serde", "js"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomRect"] }
js-sys = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "7.0"

[target.wasm32-unknown-unknown.dependencies]
rfd = "0.15"
