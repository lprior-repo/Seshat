[package]
name = "diagram_tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "diagram_tool"
path = "src/main.rs"

[lib]
name = "diagram_tool"
path = "src/lib.rs"

[dependencies]
diagram_models  = { path = "../diagram_models" }
canvas_domain   = { path = "../canvas_domain" }
canvas_math     = { path = "../canvas_math" }
dioxus          = { version = "=0.7.6" }

# Serialization + Patching
serde           = { version = "1.0", features = ["derive", "rc"] }
serde_json      = "1.0"

# IDs
uuid            = { version = "1.0", features = ["v4", "serde"] }

# Export
tiny-skia       = "0.11"
base64          = "0.22"
resvg           = "0.44"

# Utilities
anyhow          = "1.0"
smallvec        = "1.15"
indexmap        = { version = "2.0", features = ["serde"] }
thiserror       = "2.0.18"
itertools       = "0.14.0"
tap             = "1.0.1"
rpds            = "1.2.0"
im              = { version = "15.1.0", features = ["serde"] }
petgraph        = "0.8"
tempfile        = "3.10"
num_cpus        = "1.16"
dirs            = "5.0"
regex-lite      = "0.1"
futures-util = "0.3.32"
futures-channel = "0.3"
tower = { version = "0.5.3", features = ["util"] }
gloo-timers = { version = "0.3.0", features = ["futures"] }

[features]
default = ["web", "sync-db"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
sync-db = []

[build-dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.10.0"
tempfile = "3.10"
tower = { version = "0.5.3", features = ["util"] }
rand = "0.8"
dioxus-ssr = "=0.7.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
uuid = { version = "1.0", features = ["v4", "serde", "js"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomRect", "Performance"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"
tokio = { version = "1", features = ["time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
