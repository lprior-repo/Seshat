$schema: "https://moonrepo.dev/schemas/project.json"

tasks:
  serve:
    command: "sh -c 'fuser -k 8081/tcp || true; dx serve --platform web --port 8081'"
    options:
      cache: false

  check:
    command: "/usr/bin/cargo check"

  test:
    command: "/usr/bin/cargo test"

  e2e:
    command: "npm exec playwright test"
    options:
      cache: false

  clippy:
    command: "/usr/bin/cargo clippy -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic"

  fmt:
    command: "/usr/bin/cargo fmt --check"

  build-web:
    command: "dx build --platform web"

  coverage:
    command: "/usr/bin/cargo llvm-cov --summary-only"

  coverage-core:
    command: "/usr/bin/cargo llvm-cov --summary-only --ignore-filename-regex '(src/main.rs|src/bin/|src/ui/|src/hooks/)'"

  mutants:
    command: "cargo mutants --in-place"
    options:
      cache: false

  mutants-ci:
    command: "cargo mutants --in-place --check"
    options:
      cache: false

  mutants-list:
    command: "cargo mutants --list --json"
    options:
      cache: false

  mutants-quick:
    command: "cargo mutants --in-place --shard 1/4"
    options:
      cache: false

  ci:
    script: |
      /usr/bin/cargo check
      /usr/bin/cargo test
      /usr/bin/cargo clippy -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
      npm exec playwright test
