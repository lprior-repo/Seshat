$schema: "https://moonrepo.dev/schemas/project.json"

tasks:
  serve:
    script: |
      dx serve --platform web --port 8081
    options:
      cache: false

  check:
    script: |
      /usr/bin/cargo check

  test:
    script: |
      /usr/bin/cargo test

  e2e-smoke:
    command: "npm exec playwright test -- --project e2e-smoke"
    options:
      cache: false

  e2e-baseline:
    command: "npm exec playwright test -- --project baseline-chromium"
    options:
      cache: false

  e2e-redqueen-wave1:
    command: "npm exec playwright test -- --project redqueen-wave1"
    options:
      cache: false

  e2e-redqueen-wave2:
    command: "npm exec playwright test -- --project redqueen-wave2"
    options:
      cache: false

  e2e-redqueen-wave3:
    command: "npm exec playwright test -- --project redqueen-wave3"
    options:
      cache: false

  e2e-redqueen:
    command: "npm exec playwright test -- --project redqueen-seeded --grep @rq"
    options:
      cache: false

  e2e-redqueen-stress:
    command: "npm exec playwright test -- --project redqueen-stress"
    options:
      cache: false

  e2e:
    command: "moon run :e2e-baseline"
    options:
      cache: false

  clippy:
    script: |
      /usr/bin/cargo clippy -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

  fmt:
    script: |
      /usr/bin/cargo fmt --check

  build-web:
    script: |
      dx build --platform web

  coverage:
    script: |
      /usr/bin/cargo llvm-cov --summary-only

  coverage-core:
    script: |
      /usr/bin/cargo llvm-cov --summary-only --ignore-filename-regex '(src/main.rs|src/bin/|src/ui/|src/hooks/)'

  mutants:
    command: "cargo mutants --in-place"
    options:
      cache: false

  mutants-ci:
    command: "cargo mutants --in-place --check"
    options:
      cache: false

  mutants-list:
    command: "cargo mutants --list --json"
    options:
      cache: false

  mutants-quick:
    command: "cargo mutants --in-place --shard 1/4"
    options:
      cache: false

  ci:
    script: |
      moon run :check
      moon run :test
      moon run :clippy
      moon run :e2e-smoke
      moon run :e2e-redqueen-wave2

  ci-hardening:
    script: |
      moon run :check
      moon run :test
      moon run :clippy
      moon run :e2e-baseline
      moon run :e2e-redqueen-wave1
      moon run :e2e-redqueen-wave2
      moon run :e2e-redqueen-wave3

  ci-nightly:
    script: |
      moon run :ci-hardening
      moon run :e2e-redqueen-stress
      moon run :mutants-ci
