$schema: "https://moonrepo.dev/schemas/project.json"

tasks:
  serve:
    script: |
      dx serve --platform web --port 8081 --watch false --hot-reload false
    options:
      cache: false

  serve-e2e:
    script: |
      dx serve --platform web --port 8082 --open false --watch false --hot-reload false --interactive false
    options:
      cache: false

  check:
    script: |
      /usr/bin/cargo check

  test-rust:
    script: |
      /usr/bin/cargo test

  test:
    script: |
      moon run :test-rust

  e2e-smoke:
    script: |
      npm exec -- playwright test --project e2e-smoke
    options:
      cache: false

  e2e-baseline:
    script: |
      npm exec -- playwright test --project baseline
    options:
      cache: false

  e2e-seeded:
    script: |
      npm exec -- playwright test --project redqueen-seeded --grep @rq
    options:
      cache: false

  e2e-stress:
    script: |
      npm exec -- playwright test --project redqueen-stress
    options:
      cache: false

  e2e:
    script: |
      moon run :e2e-baseline
    options:
      cache: false

  e2e-hardening:
    script: |
      moon run :e2e-seeded
      moon run :e2e-stress
    options:
      cache: false

  clippy:
    script: |
      /usr/bin/cargo clippy -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

  fmt:
    script: |
      /usr/bin/cargo fmt --check

  build-web:
    script: |
      dx build --platform web

  coverage:
    script: |
      /usr/bin/cargo llvm-cov --summary-only

  coverage-core:
    script: |
      /usr/bin/cargo llvm-cov --summary-only --ignore-filename-regex '(src/main.rs|src/bin/|src/ui/|src/hooks/)'

  mutants:
    command: "cargo mutants --in-place"
    options:
      cache: false

  mutants-ci:
    command: "cargo mutants --in-place --check"
    options:
      cache: false

  mutants-list:
    command: "cargo mutants --list --json"
    options:
      cache: false

  mutants-quick:
    command: "cargo mutants --in-place --shard 1/4"
    options:
      cache: false

  ci:
    script: |
      moon run :check
      moon run :clippy
      moon run :test-rust
      moon run :e2e-baseline

  ci-hardening:
    script: |
      moon run :ci
      moon run :e2e-hardening

  ci-nightly:
    script: |
      moon run :ci-hardening
      moon run :mutants-ci
